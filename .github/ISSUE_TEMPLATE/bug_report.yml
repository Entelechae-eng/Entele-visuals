name: Bug Report
description: Report an issue, layout glitch, or unexpected behavior
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it quickly.
  - type: input
    id: component_or_resource
    attributes:
      label: Affected Resource / URL
      description: Which component, template, prompt, or route is affected?
      placeholder: 'e.g. ?category=background-animation or Component #42'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Specific steps to reproduce the behavior.
      placeholder: |
        1. Navigate to '...'
        2. Click on '...'
        3. Observe layout shift or console error '...'
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser Environment
      options:
        - Chrome / Chromium (Desktop)
        - Safari (macOS / iOS)
        - Firefox (Desktop)
        - Edge (Desktop)
        - Mobile Chrome / Safari
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Verification
      options:
        - label: I have verified this bug occurs on the latest production release (https://entele-visuals.vercel.app/).
          required: true
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
