name: Feature Request
description: Suggest an idea or enhancement for Entelechae Visuals
title: '[Feature]: '
labels: ['enhancement', 'needs-review']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement for Entelechae Visuals!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or developer workflow?
      placeholder: 'e.g. I am always frustrated when...'
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new capability you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request implementing this feature.
          required: false
