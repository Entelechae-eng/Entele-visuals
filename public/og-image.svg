<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#09090b"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 120)">
    <rect width="64" height="64" rx="16" fill="#ffffff"/>
    <path d="M32 14 L18 24 L32 34 L46 24 Z" fill="#09090b"/>
    <path d="M18 40 L32 50 L46 40" stroke="#09090b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 32 L32 42 L46 32" stroke="#09090b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Title -->
  <text x="184" y="166" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.03em">Entele-Visuals</text>
  <rect x="440" y="138" width="56" height="26" rx="6" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="454" y="156" fill="#a1a1aa" font-family="monospace" font-size="13">v2.2</text>

  <!-- Hero Headline -->
  <text x="100" y="270" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.04em">Animated UI Components</text>
  <text x="100" y="336" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-0.04em">&amp; 28,047 Web Templates</text>

  <!-- Subheadline -->
  <text x="100" y="410" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    Framer Motion · Tailwind CSS · React · Framer · Webflow · Shopify · Next.js
  </text>

  <!-- Metric Badges -->
  <g transform="translate(100, 480)">
    <rect width="200" height="64" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">897 Assets</text>
    <text x="24" y="52" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="12">Motion Components</text>
  </g>

  <g transform="translate(320, 480)">
    <rect width="240" height="64" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">28,047 Templates</text>
    <text x="24" y="52" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="12">Live Search &amp; Previews</text>
  </g>

  <g transform="translate(580, 480)">
    <rect width="180" height="64" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">100% Free</text>
    <text x="24" y="52" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="12">Copy &amp; Paste Code</text>
  </g>
</svg>
